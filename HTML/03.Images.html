<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="flower.jpg">
    <img src="/images/logo.png" alt="logo" width="200">
    <img src="/assets/images/banner.jpg" alt="banner">
    <img src="/pages/photo.jpg">
    <img src="/images/nature.jpg" alt="Beautiful nature view" width="300" height="200">
    <img src="flower.jpg" title="Click to view full size">
    <img src="/images/image.jpg" loading="lazy">
    <img src="image.jpg" loading="eager">
    <img src="image.jpg" loading="auto"><!--The browser will load the image based on some criteria like network connection.-->
    <img src="image.jpg"
    srcset="small.jpg,400w
             medium.jpg,800w
             large.jpg,1200w">
    <img src="images/image.jpg" alt="Image" width="300" height="300" loading="lazy" title="Beautiful sunset"
    srcset="small.jpg,400w
             medium.jpg,800w">
    <img src="assets/logo.png" loading="eager" alt="Company logo" width="250">
    <img src="images/products/shoe.jpg" loading="lazy" alt="Shoe image" width="250">
</body>
</html>
